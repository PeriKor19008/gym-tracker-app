name: iOS Build

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get
        working-directory: gym_tracker

      - name: Prepare iOS files (Ignore Xcode signing error)
        working-directory: gym_tracker
        # Flutter prepares the app but crashes at the Xcode signing phase.
        # Adding "|| true" forces GitHub to ignore the crash and keep going!
        run: flutter build ios --release --no-codesign || true

      - name: Force Unsigned Xcode Build
        working-directory: gym_tracker/ios
        # We take over from Flutter and force Xcode to build using absolute overrides.
        run: xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" SYMROOT="$(PWD)/../build/ios" build

      - name: Package into IPA file
        working-directory: gym_tracker
        run: |
          mkdir -p build/ios/iphoneos/Payload
          # xcodebuild outputs to the Release-iphoneos folder, so we grab it from there
          mv build/ios/Release-iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r GymTracker.ipa Payload

      - name: Upload finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: GymTracker-iOS
          path: gym_tracker/build/ios/iphoneos/GymTracker.ipa