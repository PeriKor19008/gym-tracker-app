name: iOS Build

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Debugging steps to see exactly what GitHub downloaded
      - name: Check root files
        run: ls -la

      - name: Check gym_tracker files
        run: ls -la gym_tracker

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get
        working-directory: gym_tracker # Explicitly set here

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign
        working-directory: gym_tracker # Explicitly set here

      - name: Package into IPA file
        working-directory: gym_tracker # Explicitly set here
        run: |
          mkdir -p build/ios/iphoneos/Payload
          mv build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r GymTracker.ipa Payload

      - name: Upload finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: GymTracker-iOS
          path: gym_tracker/build/ios/iphoneos/GymTracker.ipa