name: iOS Build

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get
        working-directory: gym_tracker

      # NEW STEP: Hacks the Xcode project to stop looking for an Apple ID
      - name: Disable Automatic Provisioning & Code Signing
        working-directory: gym_tracker
        run: |
          sed -i '' 's/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g' ios/Runner.xcodeproj/project.pbxproj
          echo "CODE_SIGNING_REQUIRED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_ALLOWED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGN_IDENTITY=" >> ios/Flutter/Release.xcconfig

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign
        working-directory: gym_tracker

      - name: Package into IPA file
        working-directory: gym_tracker
        run: |
          mkdir -p build/ios/iphoneos/Payload
          mv build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r GymTracker.ipa Payload

      - name: Upload finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: GymTracker-iOS
          path: gym_tracker/build/ios/iphoneos/GymTracker.ipa